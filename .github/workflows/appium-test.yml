name: Appium Mobile Application Testing Suite
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Appium Mobile Application Tests (300 Test Cases)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytest openpyxl

      - name: Run Appium Testing Suite
        run: pytest appium_tests/tests/ -v

      - name: Upload Excel Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appium_Test_Report
          path: appium_tests/Appium_Test_Report.xlsx
