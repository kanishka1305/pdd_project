name: load test
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install pytest openpyxl
      - name: Run tests
        run: pytest load_testing/tests/ || true
      - name: Upload Excel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Load_Test_Report
          path: load_testing/Load_Test_Report.xlsx
